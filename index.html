<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibeBox — Vibe-Generated HTML Tools</title>
  <meta name="description" content="A growing collection of small, single-file HTML tools for everyday workflows. No build step, no install — just open and use." />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Inter Font -->
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter font', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-100 flex flex-col">

  <!-- Header Section -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
          <i data-lucide="box" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white tracking-tight">VibeBox</h1>
          <p class="text-xs text-slate-400">Vibe-generated HTML tools for everyday workflows and quality of life.</p>
        </div>
      </div>

      <a href="https://github.com/zero41120/VibeBox" target="_blank" rel="noopener"
         class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg transition-colors">
        <i data-lucide="github" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">View on GitHub</span>
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <div class="mb-6">
      <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider flex items-center gap-2">
        <i data-lucide="layout-grid" class="w-4 h-4 text-indigo-400"></i>
        <span>Tools</span>
      </h2>
      <p class="text-xs text-slate-400 mt-1">Every tool is a single static HTML file — no build step, no install. Click a card to open it.</p>
    </div>

    <div id="toolGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <footer class="border-t border-slate-800 bg-slate-900/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 text-xs text-slate-500 flex items-center justify-between">
      <span>MIT Licensed</span>
      <span>Built with static HTML, Tailwind CDN &amp; Lucide Icons</span>
    </div>
  </footer>

  <script>
    // Registry of tools — add a new entry here whenever a new tool HTML file is added.
    const tools = [
      {
        name: 'WCAG Color Contrast Checker',
        description: 'Pick colors from any image with an eyedropper and check WCAG 2.1 contrast compliance in real time.',
        href: 'wcag_contrast_eyedropper_tool.html',
        icon: 'pipette',
        badge: 'Accessibility',
      },
      {
        name: 'Region Average Color Picker',
        description: 'Pan & zoom any image with OpenSeadragon, draw a rectangle or freehand region, and get its average color.',
        href: 'region_average_color_picker.html',
        icon: 'crop',
        badge: 'Color',
      },
      {
        name: 'Palette Maker',
        description: 'Build, randomize, and extract color palettes from images, then save, share, and export them as a card.',
        href: 'palette_maker.html',
        icon: 'palette',
        badge: 'Color',
      },
    ];

    function renderTools() {
      const grid = document.getElementById('toolGrid');
      grid.innerHTML = tools.map(tool => `
        <a href="${tool.href}" class="group bg-slate-900 border border-slate-800 hover:border-indigo-500/60 rounded-xl p-4 shadow-lg transition-all flex flex-col space-y-3">
          <div class="flex items-center justify-between">
            <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30 group-hover:bg-indigo-600/30 transition-colors">
              <i data-lucide="${tool.icon}" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
              ${tool.badge}
            </span>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white tracking-tight">${tool.name}</h3>
            <p class="text-xs text-slate-400 mt-1 leading-relaxed">${tool.description}</p>
          </div>
          <div class="pt-1 text-xs font-medium text-indigo-400 flex items-center gap-1 group-hover:gap-2 transition-all">
            <span>Open tool</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>
      `).join('');
      lucide.createIcons();
    }

    window.onload = renderTools;
  </script>
</body>
</html>
